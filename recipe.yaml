package:
  name: fluxer
  version: 2026.1006.171735

source:
  url: https://api.fluxer.app/dl/desktop/stable/linux/x64/latest/tar_gz
  sha256: b69836b50b0a64ad0542fc0fa531bd6219069198bf13601d9a1405f81e5bdfd1

build:
  number: 0
  script:
    - cp -r * ${PREFIX}/

requirements:
  build:
    - if: unix
      then: tar
      else: null
  host:
    - if: linux
      then:
        - gtk3
        - nss
        - alsa-lib
  run:
    - if: linux
      then:
        - gtk3
        - nss
        - alsa-lib

tests:
  - script:
      - fluxer --version || echo "Version check failed but binary may still work"

about:
  homepage: https://fluxer.app
  license: AGPL-3.0-only
  summary: Fluxer Desktop Application
  description: |
    Fluxer is a desktop application providing a modern interface
    for managing and interacting with various services.

extra:
  recipe-maintainers:
    - nandi-conda
